# MySQL for the ingest scripts. Settings come from .env in this folder
# (Docker Compose reads it automatically), so the scripts and the container
# always agree on database name, user and password.
#
#   docker compose up -d          start (first start creates the database + user)
#   docker compose ps             should show "healthy"
#   docker compose down           stop; data is kept in the mysql-data volume
#   docker compose down -v        stop AND delete all data (fresh start)

services:
  mysql:
    image: mysql:8.4
    container_name: jurong-marine
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_NAME:?set DB_NAME in .env}
      MYSQL_USER: ${DB_USERNAME:?set DB_USERNAME in .env}       # must not be "root"
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      TZ: Asia/Singapore
    ports:
      - "${DB_PORT:-3307}:3306"    # 3307 so it doesn't clash with a MySQL on Windows
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

volumes:
  mysql-data:
